<rect x="5.25" y="3" width="1.5" height="3" rx="0.75" fill="currentColor"/>
<rect x="9.25" y="3" width="1.5" height="3" rx="0.75" fill="currentColor"/>
<rect x="13.25" y="3" width="1.5" height="3" rx="0.75" fill="currentColor"/>

<path fill-rule="evenodd" clip-rule="evenodd" d="

  M3.75 9 H16.25 Q17.5 9 17.5 9.5 V14 Q17.5 16.5 15 16.5 H5 Q2.5 16.5 2.5 14 V9.5 Q2.5 9 3.75 9 Z
" fill="currentColor"/>

<path fill-rule="evenodd" clip-rule="evenodd" d="
  M19 10 H21 Q23 10 23 12.75 Q23 15.5 21 15.5 H19 Z
  M19 11.5 H21 Q21.5 11.5 21.5 12.75 Q21.5 14 21 14 H19 Z
" fill="currentColor"/>
<!-- Saucer: full 22px, x:1-23, gap of 1x Standard (1.5px) below cup, y:19.5 -->
<rect x="1" y="19.5" width="22" height="1.5" rx="0.75" fill="currentColor"/>
</svg>
