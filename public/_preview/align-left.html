    .variant-label { font-size: 11px; color: #aaa; text-transform: uppercase; letter-spacing: 0.08em; }
    .card.dark .variant-label { color: #666; }
    .sizes { display: flex; align-items: flex-end; gap: 20px; }
    .size-item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .size-label { font-size: 10px; color: #ccc; }
    .card.dark .size-label { color: #555; }
