<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Icon Preview — commit</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #E2E5EA;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px;
    }
    .card {
      background: #ECEEF2;
      border-radius: 16px;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    h1 { font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #7A8494; }
    .variants { display: flex; gap: 48px; align-items: flex-end; }
    .variant { display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .icon-wrap { background: #FFFFFF; border-radius: 12px; padding: 20px; border: 1px solid #D0D4DC; }
    .sizes { display: flex; gap: 24px; align-items: center; }
    .size-label { font-size: 11px; color: #AAB2BF; text-align: center; margin-top: 8px; }
    .label { font-size: 12px; font-weight: 600; color: #7A8494; letter-spacing: 0.06em; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="card">
    <h1>commit</h1>
    <div class="variants">

      <!-- Outline -->
      <div class="variant">
        <div class="icon-wrap">
          <div class="sizes">
            <div>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

                <!-- circle ring (r=6 outer, r=4.5 inner) -->
                <path fill-rule="evenodd" clip-rule="evenodd" d="M18,12 A6,6 0 1 0 6,12 A6,6 0 1 0 18,12 Z M16.5,12 A4.5,4.5 0 1 0 7.5,12 A4.5,4.5 0 1 0 16.5,12 Z" fill="#424138"/>
              </svg>
              <div class="size-label">16</div>
            </div>
            <div>
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

              </svg>
              <div class="size-label">24</div>
            </div>
            <div>
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

              </svg>
              <div class="size-label">48</div>
            </div>
          </div>
        </div>
        <div class="label">Outline</div>
      </div>
