    .variant { display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .icon-wrap { background: #FFFFFF; border-radius: 12px; padding: 20px; border: 1px solid #D0D4DC; }
    .sizes { display: flex; gap: 24px; align-items: center; }
    .size-label { font-size: 11px; color: #AAB2BF; text-align: center; margin-top: 8px; }
