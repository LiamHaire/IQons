<html lang="en">
<head>
<meta charset="UTF-8">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 640px;
  height: 640px;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 13px;
  background: #FAF9F5;
  color: #1A1916;
}

#app {
  display: flex;
  width: 640px;
  height: 640px;
  overflow: hidden;
}

/* ── Sidebar ───────────────────────────────────────────────── */
#sidebar {
  width: 160px;
  min-width: 160px;
  height: 640px;
  background: #F5F3EC;
  border-right: 1px solid #E8E4D9;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#wordmark {
  padding: 14px 14px 12px;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.02em;
  border-bottom: 1px solid #E8E4D9;
  flex-shrink: 0;
  user-select: none;
}
.wm-iq  { color: #E8531D; }
.wm-sep { color: #E8531D; margin: 0 1px; }
.wm-ons { color: #1A1916; }

#cat-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 6px 0 8px;
}
#cat-scroll::-webkit-scrollbar { width: 4px; }
#cat-scroll::-webkit-scrollbar-track { background: transparent; }
#cat-scroll::-webkit-scrollbar-thumb { background: #D4CFC3; border-radius: 2px; }

.cat-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px 6px 10px;
  cursor: pointer;
  border-left: 2px solid transparent;
  color: #6B6760;
  transition: background 0.1s, color 0.1s;
  user-select: none;
  font-size: 12px;
  line-height: 1.3;
}
.cat-item:hover { background: #EDE9DF; color: #1A1916; }
.cat-item.active {
  border-left-color: #E8531D;
  color: #1A1916;
  background: #EDE9DF;
  font-weight: 500;
}
.cat-icon {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.cat-icon svg { width: 16px; height: 16px; }

.sector-heading {
  padding: 8px 12px 4px 12px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: #9E9890;
  user-select: none;
}

/* ── Main area ─────────────────────────────────────────────── */
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  height: 640px;
  overflow: hidden;
}

/* Toolbar */
#toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px 8px;
  border-bottom: 1px solid #E8E4D9;
  flex-shrink: 0;
}

#style-tabs {
  display: flex;
  gap: 4px;
  flex-shrink: 0;
}
.style-tab {
  padding: 4px 10px;
  border-radius: 12px;
  border: 1.5px solid #E8E4D9;
  background: transparent;
  color: #6B6760;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: border-color 0.1s, color 0.1s;
  font-family: inherit;
  white-space: nowrap;
}
.style-tab:hover { border-color: #C4BFBA; color: #1A1916; }
.style-tab.active { border-color: #E8531D; color: #E8531D; }

#search-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 6px;
  background: #EDE9DF;
  border: 1px solid #E8E4D9;
  border-radius: 6px;
  padding: 5px 10px;
}
#search-wrap svg { color: #9E9890; flex-shrink: 0; }
#search-input {
  flex: 1;
  border: none;
  background: transparent;
  outline: none;
  font-size: 12px;
  color: #1A1916;
  font-family: inherit;
}
#search-input::placeholder { color: #9E9890; }

/* Count */
#count-line {
  padding: 5px 14px 4px;
  font-size: 11px;
  color: #9E9890;
  flex-shrink: 0;
}

/* Grid */
#grid-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 6px 10px 6px;
  min-height: 0;
}
#grid-scroll::-webkit-scrollbar { width: 5px; }
#grid-scroll::-webkit-scrollbar-track { background: transparent; }
#grid-scroll::-webkit-scrollbar-thumb { background: #D4CFC3; border-radius: 3px; }

#icon-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
  gap: 6px;
}

.icon-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 10px 6px 8px;
  border: 1.5px solid #E8E4D9;
  border-radius: 8px;
  background: #FDFCF8;
  cursor: pointer;
  transition: background 0.1s, border-color 0.1s;
  user-select: none;
  gap: 5px;
  min-height: 72px;
}
.icon-card:hover { background: #EDE9DF; border-color: #C4BFBA; }
.icon-card.selected { border-color: #E8531D; background: #FEF3EE; }
.icon-card:focus-visible { outline: 2px solid #E8531D; outline-offset: 1px; }

.icon-card-svg {
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.icon-card-svg svg { width: 36px; height: 36px; }

.icon-card-name {
  font-size: 10px;
  color: #6B6760;
  text-align: center;
  word-break: break-word;
  line-height: 1.3;
  max-width: 100%;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}

.no-results {
  grid-column: 1 / -1;
  padding: 40px 0;
  text-align: center;
  color: #9E9890;
  font-size: 13px;
}

/* Detail strip */
#detail-strip {
  height: 0;
  overflow: hidden;
  border-top: 1px solid transparent;
  background: #F5F3EC;
  flex-shrink: 0;
  transition: height 0.15s ease;
}
#detail-strip.visible {
  height: 104px;
  border-top-color: #E8E4D9;
}

#detail-inner {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  height: 100%;
}

#detail-preview {
  width: 56px;
  height: 56px;
  border: 1.5px solid #E8E4D9;
  border-radius: 8px;
  background: #FDFCF8;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
#detail-preview svg { width: 36px; height: 36px; }

#detail-info {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

#detail-title {
  font-size: 13px;
  font-weight: 600;
  color: #1A1916;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#detail-desc {
  font-size: 11px;
  color: #6B6760;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#detail-variant-tabs {
  display: flex;
  gap: 4px;
  margin-top: 2px;
}
.variant-tab {
  padding: 2px 8px;
  border-radius: 10px;
  border: 1px solid #E8E4D9;
  background: transparent;
  color: #6B6760;
  font-size: 10px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  transition: border-color 0.1s, color 0.1s;
}
.variant-tab:hover { border-color: #C4BFBA; color: #1A1916; }
.variant-tab.active { border-color: #E8531D; color: #E8531D; }

#add-btn {
  flex-shrink: 0;
  padding: 10px 18px;
  background: #E8531D;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.12s, transform 0.05s;
  white-space: nowrap;
}
#add-btn:hover { background: #D14517; }
#add-btn:active { transform: scale(0.97); }
#add-btn.success { background: #2A9D5C; }
</style>
</head>

// ── State ──────────────────────────────────────────────────────────────────
const state = {
  category: "all",
  style: "outline",
  query: "",
  selectedId: null,
  detailVariant: "outline",
};

// ── DOM refs ───────────────────────────────────────────────────────────────
const elCatList       = document.getElementById("cat-list");
const elStyleTabs     = document.getElementById("style-tabs");
const elSearch        = document.getElementById("search-input");
const elCountLine     = document.getElementById("count-line");
const elIconGrid      = document.getElementById("icon-grid");
const elDetailStrip   = document.getElementById("detail-strip");
const elDetailPreview = document.getElementById("detail-preview");
const elDetailTitle   = document.getElementById("detail-title");
const elDetailDesc    = document.getElementById("detail-desc");
const elDetailVariant = document.getElementById("detail-variant-tabs");
const elAddBtn        = document.getElementById("add-btn");

// ── Helpers ────────────────────────────────────────────────────────────────
function escHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function iconSvg(paths, size) {
  // Swap pure black fills for the brand near-black so icons match the palette
  const tinted = paths.replace(/fill="#000000"/g, 'fill="#1A1916"');
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" xmlns="http://www.w3.org/2000/svg">${tinted}</svg>`;
}

function resolveVariant(icon, preferredVariant) {
  if (icon.variants[preferredVariant]) return preferredVariant;
  if (icon.variants.outline)           return "outline";
  return Object.keys(icon.variants)[0] || "outline";
}

function filteredIcons() {
  const all = Object.values(PLUGIN_DATA);
  const q   = state.query.trim().toLowerCase();
  return all.filter(icon => {
    if (state.category !== "all" && icon.category !== state.category) return false;
    if (q) {
      const hit =
        icon.title.toLowerCase().includes(q) ||
        (icon.keywords || []).some(k => k.toLowerCase().includes(q)) ||
        (icon.aliases  || []).some(a => a.toLowerCase().includes(q));
      if (!hit) return false;
    }
    return true;
  });
}

// ── Render functions ───────────────────────────────────────────────────────
function renderSidebar() {
  const allCategories = [
    ...CATEGORIES.map(c => ({ ...c, sector: false })),
    ...SECTORS.map(c  => ({ ...c, sector: true  })),
  ];

  let html = "";
  let sectorHeadingAdded = false;

  for (const cat of allCategories) {
    if (cat.sector && !sectorHeadingAdded) {
      html += `<div class="sector-heading">Sector</div>`;
      sectorHeadingAdded = true;
    }
    const active  = state.category === cat.id ? "active" : "";
    const icon    = CAT_ICONS[cat.id] || "";
    html += `
      <div class="cat-item ${active}" data-cat="${escHtml(cat.id)}" role="button" tabindex="0">
        <span class="cat-icon">${icon}</span>
        <span>${escHtml(cat.label)}</span>
      </div>`;
  }

  elCatList.innerHTML = html;
}

function renderStyleTabs() {
  elStyleTabs.innerHTML = STYLE_TABS.map(t =>
    `<button class="style-tab${state.style === t.key ? " active" : ""}" data-style="${t.key}">${t.label}</button>`
  ).join("");
}

function renderGrid() {
  const icons = filteredIcons();

  elCountLine.textContent = `Showing ${icons.length} of ${Object.keys(PLUGIN_DATA).length}`;

  if (icons.length === 0) {
    elIconGrid.innerHTML = `<div class="no-results">No icons match your search.</div>`;
    return;
  }

  elIconGrid.innerHTML = icons.map(icon => {
    const variant = resolveVariant(icon, state.style);
    const paths   = icon.variants[variant] || "";
    const sel     = state.selectedId === icon.id ? " selected" : "";
    return `
      <div class="icon-card${sel}" data-id="${escHtml(icon.id)}" role="button" tabindex="0" title="${escHtml(icon.title)}">
        <div class="icon-card-svg">${iconSvg(paths, 36)}</div>
        <div class="icon-card-name">${escHtml(icon.title)}</div>
      </div>`;
  }).join("");
}

function renderDetailStrip() {
  const icon = state.selectedId ? PLUGIN_DATA[state.selectedId] : null;

  if (!icon) {
    elDetailStrip.classList.remove("visible");
    return;
  }

  elDetailStrip.classList.add("visible");

  // Preview
  const v = state.detailVariant;
  const paths = icon.variants[v] || icon.variants.outline || "";
  elDetailPreview.innerHTML = iconSvg(paths, 36);

  elDetailTitle.textContent = icon.title;
  elDetailDesc.textContent  = icon.description || "";

  // Variant tabs — only for variants this icon has
  const VARIANT_LABELS = { outline: "Outline", duotone: "Duo-tone", fill: "Fill" };
  const availableVariants = Object.keys(icon.variants).filter(k => VARIANT_LABELS[k]);
  // Ensure order: outline → duotone → fill
  const ordered = ["outline", "duotone", "fill"].filter(k => availableVariants.includes(k));

  elDetailVariant.innerHTML = ordered.map(k =>
    `<button class="variant-tab${state.detailVariant === k ? " active" : ""}" data-variant="${k}">${VARIANT_LABELS[k]}</button>`
  ).join("");
}

function fullRender() {
  renderSidebar();
  renderStyleTabs();
  renderGrid();
  renderDetailStrip();
}

// ── Event handlers ─────────────────────────────────────────────────────────

// Category sidebar
elCatList.addEventListener("click", e => {
  const item = e.target.closest("[data-cat]");
  if (!item) return;
  state.category   = item.dataset.cat;
  state.selectedId = null;
  renderSidebar();
  renderGrid();
  renderDetailStrip();
});
elCatList.addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " ") {
    e.preventDefault();
    e.target.closest("[data-cat]")?.click();
  }
});

// Style tabs
elStyleTabs.addEventListener("click", e => {
  const btn = e.target.closest("[data-style]");
  if (!btn) return;
  state.style = btn.dataset.style;
  renderStyleTabs();
  renderGrid();
  // Keep detail preview in sync if an icon is selected
  if (state.selectedId) {
    const icon = PLUGIN_DATA[state.selectedId];
    if (icon) {
      // Switch detailVariant to the new style if available, else keep current
      if (icon.variants[state.style]) {
        state.detailVariant = state.style;
      }
      renderDetailStrip();
    }
  }
});

// Search
elSearch.addEventListener("input", () => {
  state.query      = elSearch.value;
  state.selectedId = null;
  renderGrid();
  renderDetailStrip();
});

// Icon grid — event delegation
elIconGrid.addEventListener("click", e => {
  const card = e.target.closest("[data-id]");
  if (!card) return;
  const id   = card.dataset.id;
  const icon = PLUGIN_DATA[id];
  if (!icon) return;

  if (state.selectedId === id) {
    // Deselect on second click
    state.selectedId = null;
    card.classList.remove("selected");
    renderDetailStrip();
    return;
  }

  state.selectedId   = id;
  // Pick a sensible default variant for the detail strip
  state.detailVariant = resolveVariant(icon, state.style);

  // Update selected state in grid without re-rendering all cards
  const prev = elIconGrid.querySelector(".icon-card.selected");
  if (prev) prev.classList.remove("selected");
  card.classList.add("selected");

  renderDetailStrip();
  // Scroll card into view if partially hidden
  card.scrollIntoView({ block: "nearest" });
});
elIconGrid.addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " ") {
    e.preventDefault();
    e.target.closest("[data-id]")?.click();
  }
});

// Variant tabs in detail strip
elDetailVariant.addEventListener("click", e => {
  const btn = e.target.closest("[data-variant]");
  if (!btn) return;
  state.detailVariant = btn.dataset.variant;
  renderDetailStrip();
});

// Add to canvas button
elAddBtn.addEventListener("click", () => {
  if (!state.selectedId) return;
  const icon = PLUGIN_DATA[state.selectedId];
  if (!icon) return;
  const variant  = state.detailVariant;
  const svgPaths = icon.variants[variant] || icon.variants.outline || "";

  parent.postMessage({
    pluginMessage: {
      type:     "drop-icon",
      id:       icon.id,
      title:    icon.title,
      variant,
      svgPaths,
    }
  }, "*");
});

// Messages from the plugin sandbox
window.addEventListener("message", e => {
  const msg = e.data?.pluginMessage;
  if (!msg) return;

  if (msg.type === "drop-success") {
    const prev = elAddBtn.textContent;
    elAddBtn.textContent = "Added ✓";
    elAddBtn.classList.add("success");
    setTimeout(() => {
      elAddBtn.textContent = prev;
      elAddBtn.classList.remove("success");
    }, 1800);
  }

  if (msg.type === "drop-error") {
    const prev = elAddBtn.textContent;
    elAddBtn.textContent = "Error ✗";
    setTimeout(() => { elAddBtn.textContent = prev; }, 2000);
  }
});

// Keyboard shortcut: Escape deselects
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && state.selectedId) {
    state.selectedId = null;
    renderGrid();
    renderDetailStrip();
  }
});

// ── Boot ───────────────────────────────────────────────────────────────────
if (typeof PLUGIN_DATA !== "undefined" && PLUGIN_DATA) {
  fullRender();
} else {
  document.getElementById("icon-grid").innerHTML =
    `<div class="no-results">No icon data loaded.</div>`;
}
</script>
</body>
</html>
