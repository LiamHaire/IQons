<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>const PLUGIN_DATA = __PLUGIN_DATA__;</script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --background:      #FEFEFD;
  --surface:         #FAFBFC;
  --surface-raised:  #FFFFFF;
  --surface-hover:   #F5F7F8;
  --surface-active:  #EEF2F4;
  --text-primary:    #22262B;
  --text-secondary:  #6C737B;
  --text-muted:      #9299A1;
  --border-subtle:   #EDF0F3;
  --border-default:  #E2E5E8;
  --border-strong:   #D5DADF;
  --brand-primary:   #F15A24;
  --brand-hover:     #D94E18;
  --brand-soft:      #FDE8DF;
  --success:         #2F8F63;
  --icon-color:      #22262B;
}

html, body {
  width: 640px;
  height: 560px;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 13px;
  background: var(--background);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
}

#app {
  display: flex;
  flex-direction: column;
  width: 640px;
  height: 560px;
  overflow: hidden;
}

/* ── Header ────────────────────────────────────────────────────────── */
#header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 16px;
  height: 56px;
  border-bottom: 1px solid var(--border-default);
  background: var(--background);
  flex-shrink: 0;
}

#wordmark {
  font-size: 17px;
  font-weight: 800;
  letter-spacing: -0.01em;
  flex-shrink: 0;
  user-select: none;
  margin-right: 4px;
}
.wm-iq  { color: var(--brand-primary); }
.wm-ons { color: var(--text-primary); }

/* ── Search bar — pill, matches browser ────────────────────────────── */
#search-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 7px;
  height: 36px;
  border: 1px solid var(--border-default);
  border-radius: 999px;
  padding: 0 12px;
  background: transparent;
  transition: border-color 120ms;
}
#search-wrap:focus-within {
  border-color: var(--brand-primary);
  border-width: 1.5px;
}
#search-wrap:hover:not(:focus-within) {
  border-color: var(--border-strong);
  background: var(--surface-hover);
}
#search-wrap svg { color: var(--text-muted); flex-shrink: 0; }
#search-input {
  flex: 1;
  border: none;
  background: transparent;
  outline: none;
  font-size: 13px;
  color: var(--text-primary);
  font-family: inherit;
}
#search-input::placeholder { color: var(--text-muted); }
#search-clear {
  display: none;
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
  color: var(--text-muted);
  line-height: 0;
  flex-shrink: 0;
}
#search-clear:hover { color: var(--text-primary); }
#search-clear.visible { display: flex; align-items: center; }

/* ── Dropdown controls — pill style matching browser chips ─────────── */
.pill-select {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 36px;
  padding: 0 12px;
  border: 1px solid var(--border-default);
  border-radius: 999px;
  background: transparent;
  color: var(--text-primary);
  font-size: 13px;
  font-family: inherit;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  transition: border-color 120ms, background 120ms;
  -webkit-appearance: none;
  appearance: none;
  /* Custom caret via padding — we overlay with a wrapper */
}
.pill-select:hover {
  border-color: var(--border-strong);
  background: var(--surface-hover);
}
.pill-select:focus {
  outline: none;
  border-color: var(--brand-primary);
  border-width: 1.5px;
}

/* Wrapper adds the chevron icon */
.select-wrap {
  position: relative;
  display: inline-flex;
  align-items: center;
  flex-shrink: 0;
}
.select-wrap .pill-select {
  padding-right: 30px; /* room for chevron */
}
.select-caret {
  position: absolute;
  right: 10px;
  pointer-events: none;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
}

/* ── Count line ─────────────────────────────────────────────────────── */
#count-line {
  padding: 7px 16px 5px;
  font-size: 11px;
  color: var(--text-muted);
  flex-shrink: 0;
}

/* ── Grid ───────────────────────────────────────────────────────────── */
#grid-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 4px 12px 4px;
  min-height: 0;
  scrollbar-width: thin;
  scrollbar-color: var(--border-strong) transparent;
}
#grid-scroll::-webkit-scrollbar { width: 5px; }
#grid-scroll::-webkit-scrollbar-track { background: transparent; }
#grid-scroll::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 999px; }

#icon-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(68px, 1fr));
  gap: 5px;
}

.icon-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 10px 4px 8px;
  border: 1px solid var(--border-default);
  border-radius: 10px;
  background: var(--surface-raised);
  cursor: pointer;
  transition: background 120ms, border-color 120ms;
  user-select: none;
  gap: 6px;
  min-height: 70px;
}
.icon-card:hover { background: var(--surface-hover); border-color: var(--border-strong); }
.icon-card.selected { border-color: var(--brand-primary); border-width: 1.5px; background: var(--brand-soft); }

.icon-card-svg {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.icon-card-svg svg { width: 32px; height: 32px; }

.icon-card-name {
  font-size: 9.5px;
  color: var(--text-secondary);
  text-align: center;
  line-height: 1.3;
  max-width: 100%;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}

.no-results {
  grid-column: 1 / -1;
  padding: 48px 0;
  text-align: center;
  color: var(--text-muted);
  font-size: 13px;
}

/* ── Detail strip ───────────────────────────────────────────────────── */
#detail-strip {
  height: 0;
  overflow: hidden;
  border-top: 1px solid transparent;
  background: var(--surface);
  flex-shrink: 0;
  transition: height 0.14s ease;
}
#detail-strip.visible {
  height: 96px;
  border-top-color: var(--border-default);
}

#detail-inner {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px;
  height: 100%;
}

#detail-preview {
  width: 52px; height: 52px;
  border: 1px solid var(--border-default);
  border-radius: 10px;
  background: var(--surface-raised);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
#detail-preview svg { width: 32px; height: 32px; }

#detail-info {
  flex: 1; min-width: 0;
  display: flex; flex-direction: column; gap: 3px;
}

#detail-title {
  font-size: 13px; font-weight: 600;
  color: var(--text-primary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#detail-desc {
  font-size: 11px; color: var(--text-secondary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

#detail-variant-tabs {
  display: flex; gap: 4px; margin-top: 3px;
}
.variant-tab {
  padding: 2px 9px;
  border-radius: 999px;
  border: 1px solid var(--border-default);
  background: transparent;
  color: var(--text-secondary);
  font-size: 10px; font-weight: 500;
  cursor: pointer; font-family: inherit;
  transition: border-color 120ms, color 120ms;
}
.variant-tab:hover { border-color: var(--border-strong); color: var(--text-primary); }
.variant-tab.active { border-color: var(--brand-primary); border-width: 1.5px; color: var(--brand-primary); }

#add-btn {
  flex-shrink: 0;
  padding: 0 18px;
  height: 36px;
  background: var(--brand-primary);
  color: #fff;
  border: none;
  border-radius: 999px;
  font-size: 13px; font-weight: 600;
  cursor: pointer; font-family: inherit;
  transition: background 120ms, transform 60ms;
  white-space: nowrap;
}
#add-btn:hover { background: var(--brand-hover); }
#add-btn:active { transform: scale(0.97); }
#add-btn.success { background: var(--success); }
</style>
</head>
<body>
<div id="app">

  <!-- Header -->
  <header id="header">
    <div id="wordmark"><span class="wm-iq">IQ</span><span class="wm-ons">ONS</span></div>

    <!-- Search -->
    <div id="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/>
      </svg>
      <input id="search-input" type="text" placeholder="Search for an icon..." autocomplete="off" spellcheck="false">
      <button id="search-clear" aria-label="Clear search">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M18.3 4.3a1 1 0 0 1 1.4 1.4L13.4 12l6.3 6.3a1 1 0 0 1-1.4 1.4L12 13.4l-6.3 6.3a1 1 0 0 1-1.4-1.4L10.6 12 4.3 5.7a1 1 0 0 1 1.4-1.4L12 10.6l6.3-6.3z" fill="currentColor"/></svg>
      </button>
    </div>

    <!-- Category dropdown -->
    <div class="select-wrap">
      <select id="cat-select" class="pill-select"></select>
      <span class="select-caret">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </span>
    </div>

    <!-- Style dropdown -->
    <div class="select-wrap">
      <select id="style-select" class="pill-select"></select>
      <span class="select-caret">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </span>
    </div>
  </header>

  <!-- Count -->
  <div id="count-line"></div>

  <!-- Icon grid -->
  <div id="grid-scroll">
    <div id="icon-grid"></div>
  </div>

  <!-- Detail strip -->
  <div id="detail-strip">
    <div id="detail-inner">
      <div id="detail-preview"></div>
      <div id="detail-info">
        <div id="detail-title"></div>
        <div id="detail-desc"></div>
        <div id="detail-variant-tabs"></div>
      </div>
      <button id="add-btn">Add to canvas</button>
    </div>
  </div>

</div>

<script>
const ALL_CATEGORIES = [
  { id: "all",                   label: "All" },
  { id: "navigation",            label: "Navigation" },
  { id: "search-discovery",      label: "Search & Discovery" },
  { id: "data-actions",          label: "Data Actions" },
  { id: "calendar-scheduling",   label: "Calendar & Scheduling" },
  { id: "communications",        label: "Communications" },
  { id: "sharing",               label: "Sharing" },
  { id: "documents-content",     label: "Documents & Content" },
  { id: "workflow-productivity",  label: "Workflow & Productivity" },
  { id: "user-id",               label: "User & ID" },
  { id: "status-feedback",       label: "Status & Feedback" },
  { id: "security-access",       label: "Security & Access" },
  { id: "analytics-reports",     label: "Analytics & Reports" },
  { id: "settings-admin",        label: "Settings & Admin" },
  { id: "system-utility",        label: "System & Utility" },
  { id: "ai",                    label: "AI" },
  { id: "layout",                label: "Layout" },
  { id: "sector-health",         label: "Health" },
  { id: "sector-education",      label: "Education" },
  { id: "sector-legal",          label: "Legal" },
  { id: "sector-finance",        label: "Finance" },
];

const STYLE_OPTIONS = [
  { key: "outline", label: "Outline" },
  { key: "duotone", label: "Duo-tone" },
  { key: "fill",    label: "Fill" },
];

const state = { category: "all", style: "outline", query: "", selectedId: null, detailVariant: "outline" };

const elSearch        = document.getElementById("search-input");
const elSearchClear   = document.getElementById("search-clear");
const elCatSelect     = document.getElementById("cat-select");
const elStyleSelect   = document.getElementById("style-select");
const elCountLine     = document.getElementById("count-line");
const elIconGrid      = document.getElementById("icon-grid");
const elDetailStrip   = document.getElementById("detail-strip");
const elDetailPreview = document.getElementById("detail-preview");
const elDetailTitle   = document.getElementById("detail-title");
const elDetailDesc    = document.getElementById("detail-desc");
const elDetailVariant = document.getElementById("detail-variant-tabs");
const elAddBtn        = document.getElementById("add-btn");

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function iconSvg(paths, size) {
  const tinted = paths.replace(/fill="#000000"/g, 'fill="#22262B"');
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" xmlns="http://www.w3.org/2000/svg">${tinted}</svg>`;
}

function resolveVariant(icon, pref) {
  return icon.variants[pref] ? pref : (icon.variants.outline ? "outline" : Object.keys(icon.variants)[0]);
}

function filteredIcons() {
  const q = state.query.trim().toLowerCase();
  return Object.values(PLUGIN_DATA).filter(icon => {
    if (state.category !== "all" && icon.category !== state.category) return false;
    if (q) {
      const hit = icon.title.toLowerCase().includes(q) ||
        (icon.keywords||[]).some(k => k.toLowerCase().includes(q)) ||
        (icon.aliases||[]).some(a => a.toLowerCase().includes(q));
      if (!hit) return false;
    }
    return true;
  });
}

// ── Populate dropdowns ────────────────────────────────────────────────
function buildDropdowns() {
  // Category — only include categories that actually have icons
  const presentCats = new Set(Object.values(PLUGIN_DATA).map(i => i.category));
  elCatSelect.innerHTML = ALL_CATEGORIES
    .filter(c => c.id === "all" || presentCats.has(c.id))
    .map(c => `<option value="${esc(c.id)}"${c.id === state.category ? " selected" : ""}>${esc(c.label)}</option>`)
    .join("");

  // Style
  elStyleSelect.innerHTML = STYLE_OPTIONS
    .map(s => `<option value="${esc(s.key)}"${s.key === state.style ? " selected" : ""}>${esc(s.label)}</option>`)
    .join("");
}

// ── Render grid ───────────────────────────────────────────────────────
function renderGrid() {
  const icons = filteredIcons();
  const total = Object.keys(PLUGIN_DATA).length;
  elCountLine.textContent = `Showing ${icons.length} of ${total}`;

  if (!icons.length) {
    elIconGrid.innerHTML = `<div class="no-results">No icons match your search.</div>`;
    return;
  }

  elIconGrid.innerHTML = icons.map(icon => {
    const variant = resolveVariant(icon, state.style);
    const paths   = icon.variants[variant] || "";
    const sel     = state.selectedId === icon.id ? " selected" : "";
    return `<div class="icon-card${sel}" data-id="${esc(icon.id)}" role="button" tabindex="0" title="${esc(icon.title)}">
      <div class="icon-card-svg">${iconSvg(paths, 32)}</div>
      <div class="icon-card-name">${esc(icon.title)}</div>
    </div>`;
  }).join("");
}

// ── Render detail strip ───────────────────────────────────────────────
function renderDetail() {
  const icon = state.selectedId ? PLUGIN_DATA[state.selectedId] : null;
  if (!icon) { elDetailStrip.classList.remove("visible"); return; }
  elDetailStrip.classList.add("visible");

  const v = state.detailVariant;
  elDetailPreview.innerHTML = iconSvg(icon.variants[v] || icon.variants.outline || "", 32);
  elDetailTitle.textContent = icon.title;
  elDetailDesc.textContent  = icon.description || "";

  const LABELS = { outline: "Outline", duotone: "Duo-tone", fill: "Fill" };
  const ordered = ["outline","duotone","fill"].filter(k => icon.variants[k]);
  elDetailVariant.innerHTML = ordered.map(k =>
    `<button class="variant-tab${state.detailVariant === k ? " active" : ""}" data-variant="${k}">${LABELS[k]}</button>`
  ).join("");
}

function render() { renderGrid(); renderDetail(); }

// ── Events ────────────────────────────────────────────────────────────
elSearch.addEventListener("input", () => {
  state.query = elSearch.value;
  elSearchClear.classList.toggle("visible", !!state.query);
  state.selectedId = null;
  render();
});

elSearchClear.addEventListener("click", () => {
  elSearch.value = "";
  state.query = "";
  elSearchClear.classList.remove("visible");
  state.selectedId = null;
  elSearch.focus();
  render();
});

elCatSelect.addEventListener("change", () => {
  state.category   = elCatSelect.value;
  state.selectedId = null;
  render();
});

elStyleSelect.addEventListener("change", () => {
  state.style = elStyleSelect.value;
  if (state.selectedId) {
    const icon = PLUGIN_DATA[state.selectedId];
    if (icon && icon.variants[state.style]) state.detailVariant = state.style;
  }
  render();
});

elIconGrid.addEventListener("click", e => {
  const card = e.target.closest("[data-id]");
  if (!card) return;
  const id   = card.dataset.id;
  const icon = PLUGIN_DATA[id];
  if (!icon) return;

  if (state.selectedId === id) {
    state.selectedId = null;
    card.classList.remove("selected");
    renderDetail();
    return;
  }

  const prev = elIconGrid.querySelector(".icon-card.selected");
  if (prev) prev.classList.remove("selected");
  card.classList.add("selected");

  state.selectedId    = id;
  state.detailVariant = resolveVariant(icon, state.style);
  renderDetail();
  card.scrollIntoView({ block: "nearest" });
});

elIconGrid.addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); e.target.closest("[data-id]")?.click(); }
});

elDetailVariant.addEventListener("click", e => {
  const btn = e.target.closest("[data-variant]");
  if (!btn) return;
  state.detailVariant = btn.dataset.variant;
  renderDetail();
});

elAddBtn.addEventListener("click", () => {
  if (!state.selectedId) return;
  const icon = PLUGIN_DATA[state.selectedId];
  if (!icon) return;
  parent.postMessage({ pluginMessage: {
    type: "drop-icon",
    id: icon.id, title: icon.title,
    variant: state.detailVariant,
    svgPaths: icon.variants[state.detailVariant] || icon.variants.outline || "",
  }}, "*");
});

window.addEventListener("message", e => {
  const msg = e.data?.pluginMessage;
  if (!msg) return;
  if (msg.type === "drop-success") {
    const orig = elAddBtn.textContent;
    elAddBtn.textContent = "Added ✓";
    elAddBtn.classList.add("success");
    setTimeout(() => { elAddBtn.textContent = orig; elAddBtn.classList.remove("success"); }, 1800);
  }
  if (msg.type === "drop-error") {
    const orig = elAddBtn.textContent;
    elAddBtn.textContent = "Error ✗";
    setTimeout(() => { elAddBtn.textContent = orig; }, 2000);
  }
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && state.selectedId) {
    state.selectedId = null;
    renderGrid();
    renderDetail();
  }
});

// ── Boot ──────────────────────────────────────────────────────────────
if (typeof PLUGIN_DATA !== "undefined" && PLUGIN_DATA) {
  buildDropdowns();
  render();
} else {
  elIconGrid.innerHTML = `<div class="no-results">No icon data loaded.</div>`;
}
</script>
</body>
</html>
